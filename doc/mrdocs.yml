# Input
source-root: ..
# Directories that contain documented source files
input:
  - ../include
# Patterns to filter out the source-files in the directories
file-patterns:
  - '*.hpp'

# Filters
include-symbols:
  - 'boost::capy::**'
implementation-defined:
  - 'boost::capy::detail'
  - 'boost::capy::*::detail'
exclude-symbols:
  # Tuple-protocol accessor for structured bindings. Cannot be hidden with an
  # in-source BOOST_CAPY_MRDOCS guard because detail::decomposes_to instantiates
  # structured bindings on io_result during the docs parse and needs this member.
  - 'boost::capy::io_result::get'
inaccessible-members: never
inaccessible-bases: never

# Generator
generate: adoc
base-url: https://www.github.com/cppalliance/capy/blob/develop/

# Style
verbose: true
multipage: true
# use-system-libc: true
# use-system-stdlib: true

# Automation
auto-function-metadata: false

cmake: '-DCMAKE_CXX_STANDARD=20 -DBOOST_CAPY_MRDOCS_BUILD=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=OFF'
