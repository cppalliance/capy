          - compiler: "clang"
            version: "19"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-19"
            cc: "clang-19"
            runs-on: "ubuntu-24.04"
            b2-toolset: "clang"
            name: "Clang 19: C++20"
