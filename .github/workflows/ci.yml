          - compiler: "clang"
            version: "18"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-18"
            cc: "clang-18"
            runs-on: "ubuntu-24.04"
            b2-toolset: "clang"
            name: "Clang 18: C++20"
            shared: true
            build-type: "Release"

          - compiler: "clang"
            version: "17"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-17"
