name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - pr/**


concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  GIT_FETCH_JOBS: 8
  NET_RETRY_COUNT: 5
  DEFAULT_BUILD_VARIANT: debug,release
  UBSAN_OPTIONS: "print_stacktrace=1"
  DEBIAN_FRONTEND: "noninteractive"
  TZ: "Europe/London"

jobs:
  runner-selection:
    name: Runner Selection
    runs-on: ${{ github.repository_owner == 'boostorg' && fromJSON('[ "self-hosted", "linux", "x64", "ubuntu-latest-aws" ]') || 'ubuntu-latest' }}
    outputs:
      labelmatrix: ${{ steps.aws_hosted_runners.outputs.labelmatrix }}
    steps:
      - name: AWS Hosted Runners
        id: aws_hosted_runners
        uses: cppalliance/aws-hosted-runners@v1.0.0

  build:
    needs: [ runner-selection ]
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows compilers
          #

          - compiler: "msvc"
            version: "14.42"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.4"
            generator: "Visual Studio 17 2022"
            is-latest: true
            name: "MSVC 14.42: C++20"
            shared: false
            build-type: "Release"
            build-cmake: true

          - compiler: "msvc"
            version: "14.34"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.3"
            generator: "Visual Studio 17 2022"
            is-latest: true
            name: "MSVC 14.34: C++20"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "msvc"
            version: "14.34"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.3"
            generator: "Visual Studio 17 2022"
            is-latest: true
            name: "MSVC 14.34: C++20 (x86)"
            shared: false
            x86: true
            build-type: "Release"

          - compiler: "msvc"
            version: "14.34"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.3"
            generator: "Visual Studio 17 2022"
            is-latest: true
            name: "MSVC 14.34: C++20"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "clang-cl"
            version: "*"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-cl"
            cc: "clang-cl"
            runs-on: "windows-2022"
            b2-toolset: "clang-win"
            generator-toolset: "ClangCL"
            is-latest: true
            is-earliest: true
            name: "Windows-Clang: C++20"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "mingw"
            version: "*"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++"
            cc: "gcc"
            runs-on: "windows-2022"
            b2-toolset: "gcc"
            generator: "MinGW Makefiles"
            is-latest: true
            is-earliest: true
            name: "MinGW (shared): C++20"
            shared: true
            build-type: "Debug"
            build-cmake: true

          - compiler: "mingw"
            version: "*"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++"
            cc: "gcc"
            runs-on: "windows-2022"
