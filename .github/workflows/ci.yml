            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-12"
            cc: "gcc-12"
            runs-on: "ubuntu-latest"
            container: "ubuntu:22.04"
            b2-toolset: "gcc"
            name: "GCC 12: C++20"
            shared: true
