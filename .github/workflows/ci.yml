            cxxstd: "20,23"
            latest-cxxstd: "23"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20-23 (ubsan)"
            shared: false
