          - compiler: "clang"
            version: "20"
            cxxstd: "20,23"
            latest-cxxstd: "23"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20-23"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "clang"
            version: "20"
            cxxstd: "20,23"
            latest-cxxstd: "23"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20-23 (x86)"
            shared: false
            x86: true
            build-type: "Release"
            install: "gcc-multilib g++-multilib"

          - compiler: "clang"
            version: "20"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20 (time-trace)"
            shared: true
            time-trace: true
            build-type: "Release"
            cxxflags: "-ftime-trace"
            ccflags: "-ftime-trace"
            install: " wget unzip"

          - compiler: "clang"
            version: "20"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20 (asan)"
            shared: false
            asan: true
            build-type: "RelWithDebInfo"

          - compiler: "clang"
            version: "20"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20 (asan, x86)"
            shared: true
            asan: true
            x86: true
            build-type: "RelWithDebInfo"
            install: "gcc-multilib g++-multilib"

          - compiler: "clang"
