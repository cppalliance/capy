          - compiler: "gcc"
            version: "15"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-15"
            cc: "gcc-15"
            runs-on: "ubuntu-latest"
            container: "ubuntu:25.04"
            b2-toolset: "gcc"
            is-latest: true
            name: "GCC 15: C++20 (ubsan)"
            shared: true
